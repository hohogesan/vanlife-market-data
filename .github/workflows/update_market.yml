name: Update Car Market Data

on:
  schedule:
    # 毎週月曜 午前4:00 JST (UTC 日曜 19:00)
    - cron: '0 19 * * 0'
  workflow_dispatch: # 手動で動かすボタンを有効化

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Market Data Collector
        run: |
          python fetch_market_data.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market data [skip ci]" && git push)
